<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isang Liham Para Sa'yo</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        /* Estilo ng lumang papel / Maria Clara vibe */
        background-color: #d7ccc8;
        background-image: 
            radial-gradient(circle, rgba(121,85,72,0.08) 10%, transparent 10%),
            radial-gradient(circle, rgba(93,64,55,0.05) 20%, transparent 20%);
        background-size: 30px 30px;
        font-family: 'Cormorant Garamond', serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
        position: relative;
    }

    /* Lumang texture overlay para sa papel */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: url('https://images.unsplash.com/photo-1586075010923-2dd4570fb338?auto=format&fit=crop&w=1000&q=80') center/cover;
        opacity: 0.12
